<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدكتورة أية فودة - استاذة العلوم</title>
    <meta name="description" content="الدكتورة أية فودة - استاذة العلوم والعلوم المتكاملة">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
/* ======================================================
   DR. AYA FOUDA - PREMIUM PROFESSIONAL POSTER v2
   Deep Navy + Gold + Teal | Ultra Premium Design
   ====================================================== */

/* ---- Reset ---- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: #050510;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
}

/* ======================================================
   POSTER CONTAINER
   ====================================================== */
.poster {
    position: relative;
    width: 780px;
    min-height: 1050px;
    background: #080d1a;
    border-radius: 28px;
    overflow: hidden;
    padding: 55px 50px 45px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(212, 175, 55, 0.12);
    box-shadow:
        0 0 0 1px rgba(20, 184, 166, 0.06),
        0 4px 15px rgba(0,0,0,0.3),
        0 30px 80px -20px rgba(0, 0, 0, 0.7),
        0 0 120px -30px rgba(212, 175, 55, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.03);
}

/* ======================================================
   BACKGROUND LAYERS
   ====================================================== */
.bg-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.bg-gradient {
    background:
        radial-gradient(ellipse 70% 50% at 15% 85%, rgba(20, 184, 166, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 85% 15%, rgba(212, 175, 55, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(15, 23, 42, 0.9) 0%, transparent 100%),
        linear-gradient(170deg, #0a1225 0%, #070e1e 30%, #0d1530 60%, #080d1a 100%);
}

.bg-noise {
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

.bg-vignette {
    background: radial-gradient(ellipse 75% 65% at center, transparent 40%, rgba(0,0,0,0.5) 100%);
}

/* ======================================================
   GLOW ORBS
   ====================================================== */
.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    animation: breathe 8s ease-in-out infinite alternate;
}
.glow-1 {
    width: 280px; height: 280px;
    top: -80px; right: -50px;
    background: radial-gradient(circle, rgba(20, 184, 166, 0.18), transparent 70%);
}
.glow-2 {
    width: 220px; height: 220px;
    bottom: 80px; left: -60px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.12), transparent 70%);
    animation-delay: 3s;
}
.glow-3 {
    width: 180px; height: 180px;
    top: 45%; right: -70px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
    animation-delay: 5s;
}
.glow-4 {
    width: 150px; height: 150px;
    top: 20%; left: -40px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.07), transparent 70%);
    animation-delay: 7s;
}
@keyframes breathe {
    0% { opacity: 0.5; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1.15); }
}

/* ======================================================
   GRID PATTERN
   ====================================================== */
.grid-pattern {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.02;
    background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
    background-size: 60px 60px;
}

/* ======================================================
   SCIENCE DECORATIONS
   ====================================================== */
.sci-deco {
    position: absolute;
    pointer-events: none;
    opacity: 0.08;
}
.sci-atom-1 {
    width: 90px; height: 90px;
    top: 50px; left: 20px;
    color: rgba(20, 184, 166, 1);
    animation: spinSlow 30s linear infinite;
}
.sci-atom-2 {
    width: 65px; height: 65px;
    bottom: 200px; right: 20px;
    color: rgba(212, 175, 55, 0.9);
    animation: spinSlow 25s linear infinite reverse;
}
.sci-helix {
    width: 40px; height: 140px;
    top: 22%; right: 22px;
    color: rgba(20, 184, 166, 0.9);
    animation: drift 12s ease-in-out infinite;
}
.sci-molecule {
    width: 60px; height: 60px;
    top: 50%; left: 18px;
    color: rgba(56, 189, 248, 0.9);
    animation: drift 10s ease-in-out infinite;
    animation-delay: 4s;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }
@keyframes drift {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

/* ======================================================
   TOP / BOTTOM ACCENT BARS
   ====================================================== */
.top-bar, .bottom-bar {
    position: absolute;
    left: 0; right: 0;
    height: 5px;
    pointer-events: none;
}
.top-bar {
    top: 0;
    background: linear-gradient(90deg,
        transparent 5%,
        rgba(20, 184, 166, 0.5) 25%,
        rgba(212, 175, 55, 0.9) 50%,
        rgba(20, 184, 166, 0.5) 75%,
        transparent 95%);
}
.bottom-bar {
    bottom: 0;
    background: linear-gradient(90deg,
        transparent 5%,
        rgba(212, 175, 55, 0.5) 25%,
        rgba(20, 184, 166, 0.9) 50%,
        rgba(212, 175, 55, 0.5) 75%,
        transparent 95%);
}

/* ======================================================
   CORNER FRAMES
   ====================================================== */
.frame {
    position: absolute;
    width: 100px;
    height: 100px;
    pointer-events: none;
}
.frame-tl { top: 14px; left: 14px; border-top: 2px solid rgba(212, 175, 55, 0.2); border-left: 2px solid rgba(212, 175, 55, 0.2); border-radius: 14px 0 0 0; }
.frame-tr { top: 14px; right: 14px; border-top: 2px solid rgba(20, 184, 166, 0.2); border-right: 2px solid rgba(20, 184, 166, 0.2); border-radius: 0 14px 0 0; }
.frame-bl { bottom: 14px; left: 14px; border-bottom: 2px solid rgba(20, 184, 166, 0.2); border-left: 2px solid rgba(20, 184, 166, 0.2); border-radius: 0 0 0 14px; }
.frame-br { bottom: 14px; right: 14px; border-bottom: 2px solid rgba(212, 175, 55, 0.2); border-right: 2px solid rgba(212, 175, 55, 0.2); border-radius: 0 0 14px 0; }

/* ======================================================
   CONTENT WRAPPER
   ====================================================== */
.content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    gap: 6px;
}

/* ======================================================
   ANNOUNCEMENT BADGE
   ====================================================== */
.announce-badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 50px;
    border-radius: 60px;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.12), rgba(212, 175, 55, 0.04));
    border: 1.5px solid rgba(212, 175, 55, 0.25);
    margin-bottom: 16px;
    backdrop-filter: blur(12px);
}
.badge-glow {
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), transparent, rgba(20, 184, 166, 0.1));
    filter: blur(8px);
    opacity: 0.6;
    z-index: -1;
}
.badge-label {
    font-family: 'Cairo', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: #d4af37;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
}

/* ======================================================
   NAME SECTION
   ====================================================== */
.name-section {
    text-align: center;
    margin-bottom: 8px;
}
.pre-title {
    display: block;
    font-family: 'Tajawal', sans-serif;
    font-size: 2rem;
    font-weight: 600;
    color: rgba(203, 213, 225, 0.85);
    letter-spacing: 3px;
    margin-bottom: 2px;
}
.doctor-name {
    font-family: 'Cairo', sans-serif;
    font-size: 5.5rem;
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 25%, #d4af37 55%, #f5d678 80%, #d4af37 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 6s ease-in-out infinite;
    filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.15));
}
@keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* ======================================================
   SEPARATOR
   ====================================================== */
.separator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 80%;
    margin: 14px 0;
}
.sep-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), rgba(20, 184, 166, 0.3), transparent);
}
.sep-diamond {
    color: #14b8a6;
    opacity: 0.7;
    animation: pulseIcon 4s ease-in-out infinite;
}
@keyframes pulseIcon {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
}

/* ======================================================
   SUBJECT SECTION
   ====================================================== */
.subject-section {
    text-align: center;
    margin-bottom: 14px;
}
.subject-label {
    display: block;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.8rem;
    font-weight: 500;
    color: rgba(148, 163, 184, 0.85);
    margin-bottom: 4px;
}
.subject-name {
    font-family: 'Cairo', sans-serif;
    font-size: 3.2rem;
    font-weight: 800;
    color: #14b8a6;
    line-height: 1.25;
    text-shadow: 0 0 40px rgba(20, 184, 166, 0.2), 0 0 80px rgba(20, 184, 166, 0.08);
    letter-spacing: 1px;
}

/* ======================================================
   BOOKING SECTION
   ====================================================== */
.booking-section {
    text-align: center;
    margin-bottom: 18px;
}
.booking-label {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 8px 28px;
    border-radius: 40px;
    background: rgba(212, 175, 55, 0.06);
    border: 1px solid rgba(212, 175, 55, 0.15);
    font-family: 'Cairo', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: rgba(212, 175, 55, 0.85);
    margin-bottom: 10px;
}
.sparkle {
    font-size: 1rem;
    color: #d4af37;
    animation: twinkle 2.5s ease-in-out infinite;
}
@keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.8) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.4) rotate(180deg); }
}
.year-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
}
.year-num {
    font-family: 'Cairo', sans-serif;
    font-size: 4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #f59e0b, #f5d678, #d4af37);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.15));
}
.year-dash {
    color: rgba(212, 175, 55, 0.35);
    font-size: 2.2rem;
}

/* ======================================================
   FEATURES
   ====================================================== */
.features {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 26px;
}
.feat {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 28px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.06), rgba(20, 184, 166, 0.015));
    border: 1px solid rgba(20, 184, 166, 0.1);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(6px);
}
.feat:hover {
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.14), rgba(20, 184, 166, 0.04));
    border-color: rgba(20, 184, 166, 0.3);
    transform: translateX(-6px);
    box-shadow: 0 6px 25px -5px rgba(20, 184, 166, 0.15);
}
.feat-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: linear-gradient(135deg, #14b8a6, #0d9488);
    flex-shrink: 0;
    transform: rotate(45deg);
    box-shadow: 0 0 8px rgba(20, 184, 166, 0.4);
}
.feat-txt {
    font-family: 'Cairo', sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: rgba(226, 232, 240, 0.95);
    letter-spacing: 0.5px;
}

/* ======================================================
   CONTACT AREA
   ====================================================== */
.contact-area {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: auto;
}
.contact-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 28px;
    border-radius: 18px;
    transition: all 0.3s ease;
}
.phone-card {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.025));
    border: 1px solid rgba(34, 197, 94, 0.18);
}
.phone-card:hover {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.16), rgba(34, 197, 94, 0.04));
    border-color: rgba(34, 197, 94, 0.35);
    box-shadow: 0 6px 25px -5px rgba(34, 197, 94, 0.12);
}
.loc-card {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.08), rgba(212, 175, 55, 0.02));
    border: 1px solid rgba(212, 175, 55, 0.15);
}
.loc-card:hover {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.12), rgba(212, 175, 55, 0.04));
    border-color: rgba(212, 175, 55, 0.3);
    box-shadow: 0 6px 25px -5px rgba(212, 175, 55, 0.12);
}

/* Contact Icons */
.c-icon-box {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.green-icon {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.08));
    color: #22c55e;
}
.gold-icon {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.08));
    color: #d4af37;
}

/* Contact Text */
.c-text {
    font-family: 'Cairo', sans-serif;
    color: rgba(226, 232, 240, 0.95);
}
.phone-num {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 3px;
    direction: ltr;
    unicode-bidi: bidi-override;
}
.loc-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.5;
}
.loc-sub {
    font-size: 1.15rem;
    font-weight: 600;
    color: rgba(212, 175, 55, 0.7);
}

/* ======================================================
   RESPONSIVE
   ====================================================== */
@media (max-width: 820px) {
    .poster {
        width: 100%;
        max-width: 600px;
        min-height: 850px;
        padding: 40px 28px 35px;
    }
    .doctor-name { font-size: 4rem; }
    .subject-name { font-size: 2.4rem; }
    .year-num { font-size: 3rem; }
    .badge-label { font-size: 1.6rem; }
    .pre-title { font-size: 1.6rem; }
    .subject-label { font-size: 1.4rem; }
    .booking-label { font-size: 1.2rem; }
    .feat-txt { font-size: 1.25rem; }
    .phone-num { font-size: 1.5rem; }
    .loc-text { font-size: 1.1rem; }
    .features, .contact-area { max-width: 100%; }
    .sci-deco { display: none; }
}

@media (max-width: 440px) {
    body { padding: 8px; }
    .poster {
        padding: 28px 16px 25px;
        border-radius: 18px;
        min-height: 700px;
    }
    .doctor-name { font-size: 3rem; }
    .subject-name { font-size: 1.8rem; }
    .year-num { font-size: 2.4rem; }
    .feat { padding: 10px 16px; }
    .contact-card { padding: 12px 16px; }
    .frame { display: none; }
}

</style>
</head>
<body>
    <div class="poster" id="poster">
        <!-- Layered Background Effects -->
        <div class="bg-layer bg-gradient"></div>
        <div class="bg-layer bg-noise"></div>
        <div class="bg-layer bg-vignette"></div>

        <!-- Ambient Glow Orbs -->
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <!-- Geometric Grid Pattern -->
        <div class="grid-pattern"></div>

                <path d="M10,5 Q40,25 10,45 Q40,65 10,85 Q40,105 10,125 Q40,145 10,160"/>

                <line x1="16" y1="155" x2="34" y2="155" opacity="0.4"/>
            </svg>
        </div>
        <div class="sci-deco sci-molecule">

            <!-- Subject Section -->
