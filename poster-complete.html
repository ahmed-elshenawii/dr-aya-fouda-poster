<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدكتورة أية فودة - استاذة العلوم</title>
    <meta name="description" content="الدكتورة أية فودة - استاذة العلوم والعلوم المتكاملة - حجز الدروس الخصوصية">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
/* ============================================
   Dr. Aya Fouda - Professional Tutoring Poster
   Premium Dark Theme with Teal & Gold Accents
   ============================================ */

/* Reset & Base */
*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
}

/* ============================================
   Main Poster Container
   ============================================ */
.poster {
    position: relative;
    width: 700px;
    min-height: 900px;
    background: linear-gradient(160deg, #0d1117 0%, #0a1628 25%, #0f1d32 50%, #0a1628 75%, #0d1117 100%);
    border-radius: 24px;
    overflow: hidden;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    box-shadow:
        0 0 0 1px rgba(56, 189, 248, 0.08),
        0 25px 60px -15px rgba(0, 0, 0, 0.6),
        0 0 80px -20px rgba(20, 184, 166, 0.15);
}

/* ============================================
   Background Effects
   ============================================ */
.bg-pattern {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(20, 184, 166, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.04) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.02) 0%, transparent 70%);
    pointer-events: none;
}

.glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    animation: pulseGlow 6s ease-in-out infinite alternate;
}

.glow-orb-1 {
    width: 200px;
    height: 200px;
    top: -50px;
    right: -30px;
    background: radial-gradient(circle, rgba(20, 184, 166, 0.15), transparent 70%);
    animation-delay: 0s;
}

.glow-orb-2 {
    width: 150px;
    height: 150px;
    bottom: 100px;
    left: -40px;
    background: radial-gradient(circle, rgba(245, 158, 11, 0.1), transparent 70%);
    animation-delay: 2s;
}

.glow-orb-3 {
    width: 180px;
    height: 180px;
    top: 40%;
    right: -60px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
    animation-delay: 4s;
}

@keyframes pulseGlow {
    0% { opacity: 0.5; transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1.1); }
}

/* ============================================
   Science Decorative Elements
   ============================================ */
.science-element {
    position: absolute;
    pointer-events: none;
    opacity: 0.12;
    color: rgba(20, 184, 166, 1);
}

.atom-1 {
    top: 60px;
    left: 25px;
    animation: floatRotate 20s linear infinite;
}

.atom-2 {
    bottom: 180px;
    right: 20px;
    animation: floatRotate 25s linear infinite reverse;
    color: rgba(245, 158, 11, 0.8);
}

.molecule-1 {
    top: 45%;
    left: 15px;
    animation: floatUpDown 8s ease-in-out infinite;
    color: rgba(56, 189, 248, 0.9);
}

.dna-1 {
    top: 20%;
    right: 25px;
    animation: floatUpDown 10s ease-in-out infinite;
    animation-delay: 2s;
    color: rgba(20, 184, 166, 0.8);
}

@keyframes floatRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes floatUpDown {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* ============================================
   Accent Lines
   ============================================ */
.accent-line {
    position: absolute;
    pointer-events: none;
}

.accent-line-top {
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(20, 184, 166, 0.6) 20%,
        rgba(245, 158, 11, 0.8) 50%,
        rgba(20, 184, 166, 0.6) 80%,
        transparent 100%
    );
}

.accent-line-bottom {
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg,
        transparent 0%,
        rgba(245, 158, 11, 0.6) 20%,
        rgba(20, 184, 166, 0.8) 50%,
        rgba(245, 158, 11, 0.6) 80%,
        transparent 100%
    );
}

/* ============================================
   Corner Decorations
   ============================================ */
.corner-deco {
    position: absolute;
    width: 80px;
    height: 80px;
    pointer-events: none;
}

.corner-top-right {
    top: 12px;
    right: 12px;
    border-top: 2px solid rgba(20, 184, 166, 0.3);
    border-right: 2px solid rgba(20, 184, 166, 0.3);
    border-radius: 0 12px 0 0;
}

.corner-bottom-left {
    bottom: 12px;
    left: 12px;
    border-bottom: 2px solid rgba(245, 158, 11, 0.3);
    border-left: 2px solid rgba(245, 158, 11, 0.3);
    border-radius: 0 0 0 12px;
}

/* ============================================
   Content Layout
   ============================================ */
.content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
}

/* ============================================
   Header Badge
   ============================================ */
.header-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 28px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.15), rgba(20, 184, 166, 0.05));
    border: 1px solid rgba(20, 184, 166, 0.25);
    border-radius: 50px;
    margin-bottom: 28px;
    animation: fadeInDown 0.6s ease-out;
    backdrop-filter: blur(10px);
}

.badge-icon {
    font-size: 1.3rem;
}

.badge-text {
    font-family: 'Cairo', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: rgba(20, 184, 166, 0.9);
    letter-spacing: 2px;
}

/* ============================================
   Title Section
   ============================================ */
.title-section {
    text-align: center;
    margin-bottom: 30px;
    animation: fadeInUp 0.8s ease-out;
}

.subtitle {
    font-family: 'Tajawal', sans-serif;
    font-size: 1.4rem;
    font-weight: 500;
    color: rgba(148, 163, 184, 0.9);
    margin-bottom: 6px;
    letter-spacing: 1px;
}

.main-name {
    font-family: 'Cairo', sans-serif;
    font-size: 3.8rem;
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #f5f5f5 0%, #e2e8f0 40%, #d4a853 70%, #f0c674 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 2px 8px rgba(212, 168, 83, 0.15));
}

.title-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 18px 0;
}

.divider-line {
    display: block;
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(20, 184, 166, 0.5), transparent);
}

.divider-icon {
    font-size: 1.5rem;
    animation: pulse 3s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
}

.subject-title {
    font-family: 'Tajawal', sans-serif;
    font-size: 1.3rem;
    font-weight: 500;
    color: rgba(148, 163, 184, 0.8);
    margin-bottom: 6px;
}

.subject-name {
    font-family: 'Cairo', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: #14b8a6;
    text-shadow: 0 0 30px rgba(20, 184, 166, 0.2);
    line-height: 1.3;
}

/* ============================================
   Booking Section
   ============================================ */
.booking-section {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeInUp 1s ease-out;
}

.booking-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 20px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.2);
    border-radius: 30px;
    margin-bottom: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: rgba(245, 158, 11, 0.85);
}

.booking-icon {
    color: #f59e0b;
    font-size: 0.9rem;
    animation: sparkle 2s ease-in-out infinite;
}

@keyframes sparkle {
    0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
}

.year-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
}

.year {
    font-family: 'Cairo', sans-serif;
    font-size: 2.8rem;
    font-weight: 900;
    background: linear-gradient(135deg, #f59e0b, #f0c674, #f59e0b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
}

.year-separator {
    color: rgba(245, 158, 11, 0.4);
    font-size: 2rem;
    font-weight: 300;
}

/* ============================================
   Features Section
   ============================================ */
.features-section {
    width: 100%;
    max-width: 420px;
    margin: 0 auto 36px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.feature-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.06), rgba(20, 184, 166, 0.02));
    border: 1px solid rgba(20, 184, 166, 0.1);
    border-radius: 14px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    animation: fadeInRight 0.6s ease-out both;
    backdrop-filter: blur(5px);
}

.feature-item:hover {
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.12), rgba(20, 184, 166, 0.04));
    border-color: rgba(20, 184, 166, 0.25);
    transform: translateX(-4px);
    box-shadow: 0 4px 20px -5px rgba(20, 184, 166, 0.15);
}

.feature-icon {
    color: #14b8a6;
    font-size: 0.65rem;
    flex-shrink: 0;
    opacity: 0.8;
}

.feature-text {
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    color: rgba(226, 232, 240, 0.9);
}

/* ============================================
   Contact Section
   ============================================ */
.contact-section {
    width: 100%;
    max-width: 420px;
    margin: auto auto 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeInUp 1.2s ease-out;
}

.contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 24px;
    border-radius: 16px;
    transition: all 0.3s ease;
}

.phone-item {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(34, 197, 94, 0.03));
    border: 1px solid rgba(34, 197, 94, 0.2);
}

.phone-item:hover {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05));
    border-color: rgba(34, 197, 94, 0.35);
    box-shadow: 0 4px 20px -5px rgba(34, 197, 94, 0.15);
}

.location-item {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(245, 158, 11, 0.02));
    border: 1px solid rgba(245, 158, 11, 0.18);
}

.location-item:hover {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(245, 158, 11, 0.04));
    border-color: rgba(245, 158, 11, 0.3);
    box-shadow: 0 4px 20px -5px rgba(245, 158, 11, 0.15);
}

.contact-icon-wrapper {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.08));
    color: #22c55e;
}

.location-icon-wrapper {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.08));
    color: #f59e0b;
}

.contact-icon {
    color: inherit;
}

.contact-text {
    font-family: 'Cairo', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: rgba(226, 232, 240, 0.95);
    letter-spacing: 0.5px;
}

.phone-number {
    direction: ltr;
    unicode-bidi: bidi-override;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 2px;
}

.location-text {
    line-height: 1.6;
    font-size: 1.05rem;
    font-weight: 600;
}

/* ============================================
   Animations
   ============================================ */
@keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInRight {
    from { opacity: 0; transform: translateX(25px); }
    to { opacity: 1; transform: translateX(0); }
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 740px) {
    .poster {
        width: 100%;
        max-width: 500px;
        min-height: 750px;
        padding: 36px 24px;
        border-radius: 18px;
    }

    .main-name {
        font-size: 2.8rem;
    }

    .subject-name {
        font-size: 1.7rem;
    }

    .year {
        font-size: 2.2rem;
    }

    .features-section,
    .contact-section {
        max-width: 100%;
    }

    .feature-item {
        padding: 10px 16px;
    }

    .contact-item {
        padding: 12px 18px;
    }

    .science-element {
        display: none;
    }
}

@media (max-width: 400px) {
    body {
        padding: 10px;
    }

    .poster {
        padding: 28px 16px;
        border-radius: 14px;
    }

    .main-name {
        font-size: 2.2rem;
    }

    .subject-name {
        font-size: 1.4rem;
    }

    .year {
        font-size: 1.8rem;
    }
}

</style>
</head>

    <script>
        // Add staggered animation to features
        document.addEventListener('DOMContentLoaded', () => {
            const features = document.querySelectorAll('.feature-item');
            features.forEach((feature, index) => {
                feature.style.animationDelay = `${0.8 + index * 0.15}s`;
            });
