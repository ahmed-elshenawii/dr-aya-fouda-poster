<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدكتورة أية فودة - استاذة العلوم</title>
    <meta name="description" content="الدكتورة أية فودة - استاذة العلوم والعلوم المتكاملة">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   DR. AYA FOUDA — ULTRA PREMIUM POSTER v3
   Professional UI/UX with Cinematic Animations
   ============================================================ */

/* ---- Reset ---- */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --gold: #d4af37;
    --gold-light: #f5d678;
    --gold-dark: #b8941f;
    --teal: #14b8a6;
    --teal-light: #2dd4bf;
    --teal-dark: #0d9488;
    --cyan: #22d3ee;
    --green: #22c55e;
    --navy: #080d1a;
    --navy-light: #0f172a;
}

body {
    font-family: 'Cairo', 'Tajawal', sans-serif;
    background: #030308;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    direction: rtl;
    overflow-x: hidden;
}

/* ============================================================
   PARTICLE CANVAS
   ============================================================ */
#particleCanvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

/* ============================================================
   POSTER CONTAINER
   ============================================================ */
.poster {
    position: relative;
    z-index: 1;
    width: 800px;
    min-height: 1100px;
    background: var(--navy);
    border-radius: 32px;
    overflow: hidden;
    padding: 55px 50px 45px;
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(212, 175, 55, 0.1);
    box-shadow:
        0 0 0 1px rgba(20, 184, 166, 0.05),
        0 8px 32px rgba(0,0,0,0.4),
        0 40px 100px -25px rgba(0, 0, 0, 0.8),
        0 0 150px -40px rgba(212, 175, 55, 0.06),
        0 0 150px -40px rgba(20, 184, 166, 0.04);
    animation: posterEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes posterEntrance {
    from { opacity: 0; transform: scale(0.92) translateY(30px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ============================================================
   BACKGROUND EFFECTS
   ============================================================ */
.bg-mesh {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(ellipse 60% 45% at 20% 80%, rgba(20, 184, 166, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 15%, rgba(212, 175, 55, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 90% 70% at 50% 50%, rgba(8, 13, 26, 0.95) 0%, transparent 100%),
        linear-gradient(175deg, #0a1428 0%, #070d1c 25%, #0d1530 55%, #080d1a 100%);
    animation: meshShift 15s ease-in-out infinite alternate;
}

@keyframes meshShift {
    0% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(8deg) brightness(1.05); }
    100% { filter: hue-rotate(-5deg) brightness(0.97); }
}

.bg-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at center, transparent 35%, rgba(0,0,0,0.55) 100%);
}

/* ============================================================
   GLOW ORBS — Ambient Breathing
   ============================================================ */
.orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: orbFloat 10s ease-in-out infinite alternate;
}
.orb-1 {
    width: 350px; height: 350px;
    top: -120px; right: -80px;
    background: radial-gradient(circle, rgba(20, 184, 166, 0.14), transparent 70%);
    filter: blur(90px);
}
.orb-2 {
    width: 280px; height: 280px;
    bottom: 50px; left: -90px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.1), transparent 70%);
    filter: blur(80px);
    animation-delay: 4s;
}
.orb-3 {
    width: 200px; height: 200px;
    top: 40%; right: -60px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.06), transparent 70%);
    filter: blur(70px);
    animation-delay: 7s;
}

@keyframes orbFloat {
    0% { opacity: 0.4; transform: scale(0.8) translate(0, 0); }
    33% { opacity: 0.8; transform: scale(1.05) translate(10px, -10px); }
    66% { opacity: 0.6; transform: scale(0.95) translate(-5px, 8px); }
    100% { opacity: 1; transform: scale(1.15) translate(5px, -5px); }
}

/* ============================================================
   FLOATING SCIENCE ICONS
   ============================================================ */
.float-icon {
    position: absolute;
    pointer-events: none;
    opacity: 0.07;
}
.fi-1 {
    width: 100px; height: 100px;
    top: 40px; left: 15px;
    color: var(--teal);
    animation: spinFloat 28s linear infinite;
}
.fi-2 {
    width: 70px; height: 70px;
    bottom: 220px; right: 15px;
    color: var(--gold);
    animation: spinFloat 22s linear infinite reverse;
}
.fi-3 {
    width: 35px; height: 130px;
    top: 25%; right: 20px;
    color: var(--teal-light);
    animation: driftY 14s ease-in-out infinite;
}
.fi-4 {
    width: 55px; height: 55px;
    top: 55%; left: 15px;
    color: var(--cyan);
    animation: driftY 11s ease-in-out infinite;
    animation-delay: 3s;
}

@keyframes spinFloat {
    to { transform: rotate(360deg); }
}
@keyframes driftY {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(5deg); }
}

/* ============================================================
   ACCENT BARS — Animated Gradient
   ============================================================ */
.top-bar, .bottom-bar {
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    pointer-events: none;
    background-size: 200% 100%;
    animation: barSlide 4s ease-in-out infinite alternate;
}
.top-bar {
    top: 0;
    background: linear-gradient(90deg,
        transparent 0%, var(--teal) 20%, var(--gold) 50%, var(--teal) 80%, transparent 100%);
    background-size: 200% 100%;
}
.bottom-bar {
    bottom: 0;
    background: linear-gradient(90deg,
        transparent 0%, var(--gold) 20%, var(--teal) 50%, var(--gold) 80%, transparent 100%);
    background-size: 200% 100%;
}
@keyframes barSlide {
    from { background-position: 0% 0; }
    to { background-position: 100% 0; }
}

/* ============================================================
   CORNER FRAMES — Animated Draw-in
   ============================================================ */
.corner {
    position: absolute;
    width: 90px;
    height: 90px;
    pointer-events: none;
}
.c-tl {
    top: 14px; left: 14px;
    border-top: 2px solid rgba(212, 175, 55, 0.25);
    border-left: 2px solid rgba(212, 175, 55, 0.25);
    border-radius: 16px 0 0 0;
    animation: cornerDraw 1.5s ease-out 0.3s both;
}
.c-tr {
    top: 14px; right: 14px;
    border-top: 2px solid rgba(20, 184, 166, 0.25);
    border-right: 2px solid rgba(20, 184, 166, 0.25);
    border-radius: 0 16px 0 0;
    animation: cornerDraw 1.5s ease-out 0.5s both;
}
.c-bl {
    bottom: 14px; left: 14px;
    border-bottom: 2px solid rgba(20, 184, 166, 0.25);
    border-left: 2px solid rgba(20, 184, 166, 0.25);
    border-radius: 0 0 0 16px;
    animation: cornerDraw 1.5s ease-out 0.7s both;
}
.c-br {
    bottom: 14px; right: 14px;
    border-bottom: 2px solid rgba(212, 175, 55, 0.25);
    border-right: 2px solid rgba(212, 175, 55, 0.25);
    border-radius: 0 0 16px 0;
    animation: cornerDraw 1.5s ease-out 0.9s both;
}
@keyframes cornerDraw {
    from { width: 0; height: 0; opacity: 0; }
    to { width: 90px; height: 90px; opacity: 1; }
}

/* ============================================================
   CONTENT LAYOUT
   ============================================================ */
.content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    gap: 4px;
}

/* ============================================================
   ANIMATION BASE (Items animate in on scroll)
   ============================================================ */
.anim-item {
    opacity: 0;
    transform: translateY(35px);
    filter: blur(6px);
    transition: none;
}
.anim-item.visible {
    animation: revealUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes revealUp {
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* ============================================================
   ANNOUNCEMENT BADGE
   ============================================================ */
.badge-wrap {
    margin-bottom: 18px;
}
.badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 56px;
    border-radius: 60px;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.12), rgba(212, 175, 55, 0.03));
    border: 1.5px solid rgba(212, 175, 55, 0.3);
    overflow: hidden;
    backdrop-filter: blur(12px);
}
.badge span {
    font-family: 'Cairo', sans-serif;
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 8px;
    text-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
    position: relative;
    z-index: 2;
}
.badge-shimmer {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
    animation: shimmerSlide 3s ease-in-out infinite;
    z-index: 1;
}
@keyframes shimmerSlide {
    0% { left: -100%; }
    100% { left: 200%; }
}

/* ============================================================
   NAME SECTION
   ============================================================ */
.name-block {
    text-align: center;
    margin-bottom: 4px;
}
.pre-name {
    display: block;
    font-family: 'Tajawal', sans-serif;
    font-size: 2.2rem;
    font-weight: 600;
    color: rgba(203, 213, 225, 0.85);
    letter-spacing: 4px;
    margin-bottom: 2px;
}

.the-name {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    line-height: 1.1;
}

.name-char {
    display: inline-block;
    font-family: 'Cairo', sans-serif;
    font-size: 6rem;
    font-weight: 900;
    background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 20%, #d4af37 50%, #f5d678 75%, #d4af37 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: charReveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) both,
               nameShimmer 5s ease-in-out infinite;
    filter: drop-shadow(0 4px 20px rgba(212, 175, 55, 0.2));
    opacity: 0;
    transform: translateY(30px) scale(0.7) rotateX(40deg);
}

.name-spacer {
    display: inline-block;
    width: 18px;
}

@keyframes charReveal {
    to {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
    }
}

@keyframes nameShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

.name-glow-line {
    width: 70%;
    height: 2px;
    margin: 8px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), var(--teal), var(--gold), transparent);
    background-size: 200% 100%;
    animation: glowLineSlide 3s ease-in-out infinite alternate;
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
}

@keyframes glowLineSlide {
    from { background-position: 0% 0; opacity: 0.5; }
    to { background-position: 100% 0; opacity: 1; }
}

/* ============================================================
   SEPARATOR
   ============================================================ */
.sep-wrap { width: 75%; margin: 12px 0; }
.sep {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}
.sep-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.35), rgba(20, 184, 166, 0.25), transparent);
    transform: scaleX(0);
    animation: lineGrow 1.2s ease-out 1s both;
}
.sep-line-r { transform-origin: left; }
.sep-line-l { transform-origin: right; }

.visible .sep-line { animation: lineGrow 1.2s ease-out 0.3s both; }

@keyframes lineGrow {
    to { transform: scaleX(1); }
}

.sep-icon {
    font-size: 2rem;
    animation: floatBounce 3s ease-in-out infinite;
}
@keyframes floatBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.1); }
}

/* ============================================================
   SUBJECT
   ============================================================ */
.subject-block {
    text-align: center;
    margin-bottom: 12px;
}
.subj-label {
    display: block;
    font-family: 'Tajawal', sans-serif;
    font-size: 2rem;
    font-weight: 500;
    color: rgba(148, 163, 184, 0.85);
    margin-bottom: 4px;
}
.subj-name {
    font-family: 'Cairo', sans-serif;
    font-size: 3.4rem;
    font-weight: 900;
    line-height: 1.25;
    color: var(--teal);
    text-shadow:
        0 0 40px rgba(20, 184, 166, 0.25),
        0 0 80px rgba(20, 184, 166, 0.08);
    letter-spacing: 1px;
    animation: textGlow 4s ease-in-out infinite alternate;
}
@keyframes textGlow {
    from { text-shadow: 0 0 30px rgba(20, 184, 166, 0.15), 0 0 60px rgba(20, 184, 166, 0.05); }
    to { text-shadow: 0 0 50px rgba(20, 184, 166, 0.3), 0 0 100px rgba(20, 184, 166, 0.1); }
}

/* ============================================================
   BOOKING SECTION
   ============================================================ */
.booking-block {
    text-align: center;
    margin-bottom: 16px;
}
.book-label {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 10px 32px;
    border-radius: 40px;
    background: rgba(212, 175, 55, 0.06);
    border: 1px solid rgba(212, 175, 55, 0.15);
    font-family: 'Cairo', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: rgba(212, 175, 55, 0.85);
    margin-bottom: 10px;
}
.star {
    font-size: 1.1rem;
    color: var(--gold);
}
.star-r { animation: starTwinkle 2.5s ease-in-out infinite; }
.star-l { animation: starTwinkle 2.5s ease-in-out infinite 1.25s; }
@keyframes starTwinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.7) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.5) rotate(180deg); }
}

.years {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}
.yr {
    font-family: 'Cairo', sans-serif;
    font-size: 4.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, #f59e0b 0%, #f5d678 40%, #d4af37 70%, #f0c674 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    filter: drop-shadow(0 3px 10px rgba(212, 175, 55, 0.2));
}
.yr-arrow {
    color: rgba(212, 175, 55, 0.4);
    display: flex;
    align-items: center;
    animation: arrowPulse 2s ease-in-out infinite;
}
@keyframes arrowPulse {
    0%, 100% { transform: translateX(0); opacity: 0.4; }
    50% { transform: translateX(-6px); opacity: 0.8; }
}

/* ============================================================
   FEATURES — With Pulsing Markers
   ============================================================ */
.features-grid {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
}
.feat {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 15px 30px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.05), rgba(20, 184, 166, 0.01));
    border: 1px solid rgba(20, 184, 166, 0.08);
    font-family: 'Cairo', sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: rgba(226, 232, 240, 0.95);
    letter-spacing: 0.5px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(6px);
    cursor: default;
}
.feat:hover {
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.14), rgba(20, 184, 166, 0.03));
    border-color: rgba(20, 184, 166, 0.3);
    transform: translateX(-8px) scale(1.02);
    box-shadow: 0 8px 30px -6px rgba(20, 184, 166, 0.18);
}

.feat-marker {
    position: relative;
    width: 12px;
    height: 12px;
    flex-shrink: 0;
}
.feat-marker::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 3px;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    transform: rotate(45deg);
    box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
}
.feat-pulse {
    position: absolute;
    inset: -4px;
    border-radius: 4px;
    border: 1px solid var(--teal);
    transform: rotate(45deg);
    animation: markerPulse 2.5s ease-out infinite;
    opacity: 0;
}
@keyframes markerPulse {
    0% { transform: rotate(45deg) scale(1); opacity: 0.6; }
    100% { transform: rotate(45deg) scale(2); opacity: 0; }
}

/* ============================================================
   CONTACT CARDS — Animated Gradient Border
   ============================================================ */
.contact-zone {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: auto;
}
.ccard {
    position: relative;
    border-radius: 20px;
    padding: 2px;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.ccard:hover {
    transform: translateY(-3px);
}

/* Animated gradient border */
.ccard-border {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 2px;
    background-size: 300% 300%;
    animation: borderRotate 5s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}
.phone-ccard .ccard-border {
    background: linear-gradient(135deg, var(--green), var(--teal), var(--green), var(--teal));
    background-size: 300% 300%;
}
.loc-ccard .ccard-border {
    background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold), var(--gold-light));
    background-size: 300% 300%;
}
.phone-ccard:hover {
    box-shadow: 0 8px 30px -5px rgba(34, 197, 94, 0.15);
}
.loc-ccard:hover {
    box-shadow: 0 8px 30px -5px rgba(212, 175, 55, 0.15);
}

@keyframes borderRotate {
    0% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
    100% { background-position: 0% 0%; }
}

.ccard-inner {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px 30px;
    border-radius: 18px;
    background: var(--navy);
}

.ccard-icon {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.green-ci {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.18), rgba(34, 197, 94, 0.06));
    color: var(--green);
}
.gold-ci {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
    color: var(--gold);
}

/* Phone ring pulse */
.ring-pulse {
    position: absolute;
    inset: 0;
    border-radius: 15px;
    border: 2px solid var(--green);
    animation: ringPulse 2s ease-out infinite;
    opacity: 0;
}
@keyframes ringPulse {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.5); opacity: 0; }
}

/* Location pin bounce */
.pin-bounce {
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 4px;
    border-radius: 50%;
    background: rgba(212, 175, 55, 0.3);
    filter: blur(2px);
    animation: pinShadow 2s ease-in-out infinite;
}
@keyframes pinShadow {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.3; }
    50% { transform: translateX(-50%) scale(0.6); opacity: 0.6; }
}

/* Contact texts */
.phone-text {
    font-family: 'Cairo', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: rgba(226, 232, 240, 0.95);
    letter-spacing: 3px;
    direction: ltr;
    unicode-bidi: bidi-override;
}
.loc-lines {
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.loc-main {
    font-family: 'Cairo', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: rgba(226, 232, 240, 0.95);
}
.loc-sub {
    font-family: 'Cairo', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: rgba(212, 175, 55, 0.7);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 850px) {
    .poster {
        width: 100%;
        max-width: 620px;
        min-height: 900px;
        padding: 40px 28px 35px;
    }
    .name-char { font-size: 4.5rem; }
    .subj-name { font-size: 2.6rem; }
    .yr { font-size: 3.5rem; }
    .badge span { font-size: 1.8rem; }
    .pre-name { font-size: 1.8rem; }
    .subj-label { font-size: 1.6rem; }
    .book-label { font-size: 1.3rem; }
    .feat { font-size: 1.35rem; padding: 12px 22px; }
    .phone-text { font-size: 1.6rem; }
    .loc-main { font-size: 1.2rem; }
    .features-grid, .contact-zone { max-width: 100%; }
    .float-icon { display: none; }
}

@media (max-width: 440px) {
    body { padding: 8px; }
    .poster {
        padding: 24px 14px 20px;

<body>

                <line x1="44" y1="36" x2="29" y2="61"/><line x1="56" y1="36" x2="71" y2="61"/><line x1="32" y1="68" x2="68" y2="68"/>

        <!-- ========== CONTENT ========== -->

    <script>
    // ============ PARTICLE SYSTEM ============
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const PARTICLE_COUNT = 60;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.4;
            this.speedY = (Math.random() - 0.5) * 0.4;
            this.opacity = Math.random() * 0.4 + 0.1;
            this.hue = Math.random() > 0.5 ? 170 : 45; // teal or gold
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
            ctx.fill();
        }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });

        // Draw connections
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(20, 184, 166, ${0.06 * (1 - dist / 120)})`;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ============ SCROLL ENTRANCE ANIMATIONS ============
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const delay = parseFloat(entry.target.dataset.delay || 0) * 0.18;
                entry.target.style.animationDelay = `${delay}s`;
                entry.target.classList.add('visible');
            }
        });
    }, { threshold: 0.1 });

    document.querySelectorAll('.anim-item').forEach(el => observer.observe(el));

    // ============ NAME LETTER ANIMATION ============
    document.querySelectorAll('.name-char').forEach((ch, i) => {
        ch.style.animationDelay = `${0.6 + i * 0.12}s`;
    });
    </script>
