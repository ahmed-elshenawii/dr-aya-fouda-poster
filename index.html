<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدكتورة أية فودة - استاذة العلوم</title>
    <meta name="description" content="الدكتورة أية فودة - استاذة العلوم والعلوم المتكاملة - حجز الدروس الخصوصية">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="poster" id="poster">
        <!-- Background Decorative Elements -->
        <div class="bg-pattern"></div>
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
        <div class="glow-orb glow-orb-3"></div>
        
        <!-- Floating Science Elements -->
        <div class="science-element atom atom-1">
            <svg viewBox="0 0 100 100" width="60" height="60">
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(0 50 50)"/>
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(60 50 50)"/>
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(120 50 50)"/>
                <circle cx="50" cy="50" r="5" fill="currentColor"/>
            </svg>
        </div>
        <div class="science-element atom atom-2">
            <svg viewBox="0 0 100 100" width="45" height="45">
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(0 50 50)"/>
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(60 50 50)"/>
                <ellipse cx="50" cy="50" rx="45" ry="18" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(120 50 50)"/>
                <circle cx="50" cy="50" r="5" fill="currentColor"/>
            </svg>
        </div>
        <div class="science-element molecule molecule-1">
            <svg viewBox="0 0 80 80" width="50" height="50">
                <circle cx="20" cy="40" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="50" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="50" cy="60" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <line x1="27" y1="36" x2="44" y2="23" stroke="currentColor" stroke-width="1.5"/>
                <line x1="27" y1="44" x2="44" y2="57" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </div>
        <div class="science-element dna dna-1">
            <svg viewBox="0 0 40 120" width="30" height="90">
                <path d="M10,10 Q30,30 10,50 Q30,70 10,90 Q30,110 10,120" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M30,10 Q10,30 30,50 Q10,70 30,90 Q10,110 30,120" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <line x1="12" y1="20" x2="28" y2="20" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="12" y1="40" x2="28" y2="40" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="12" y1="60" x2="28" y2="60" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="12" y1="80" x2="28" y2="80" stroke="currentColor" stroke-width="1" opacity="0.5"/>
                <line x1="12" y1="100" x2="28" y2="100" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
        </div>

        <!-- Geometric Accent Lines -->
        <div class="accent-line accent-line-top"></div>
        <div class="accent-line accent-line-bottom"></div>

        <!-- Content -->
        <div class="content">
            <!-- Header Badge -->
            <div class="header-badge">
                <span class="badge-icon">📢</span>
                <span class="badge-text">تعلن</span>
            </div>

            <!-- Main Title Section -->
            <div class="title-section">
                <p class="subtitle">الدكتورة</p>
                <h1 class="main-name">أية فودة</h1>
                <div class="title-divider">
                    <span class="divider-line"></span>
                    <span class="divider-icon">🔬</span>
                    <span class="divider-line"></span>
                </div>
                <p class="subject-title">استاذة</p>
                <h2 class="subject-name">العلوم والعلوم المتكاملة</h2>
            </div>

            <!-- Booking Section -->
            <div class="booking-section">
                <div class="booking-badge">
                    <span class="booking-icon">✦</span>
                    <span>بدأ الحجز لعام</span>
                </div>
                <div class="year-display">
                    <span class="year">٢٠٢٦</span>
                    <span class="year-separator">—</span>
                    <span class="year">٢٠٢٧</span>
                </div>
            </div>

            <!-- Features Section -->
            <div class="features-section">
                <div class="feature-item">
                    <span class="feature-icon">◆</span>
                    <span class="feature-text">شرح مبسط وسهل</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">◆</span>
                    <span class="feature-text">تأسيس وتقوية</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">◆</span>
                    <span class="feature-text">امتحانات دورية</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">◆</span>
                    <span class="feature-text">مراجعات مستمرة</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">◆</span>
                    <span class="feature-text">متابعة مع ولي الأمر</span>
                </div>
            </div>

            <!-- Contact Section -->
            <div class="contact-section">
                <div class="contact-item phone-item">
                    <div class="contact-icon-wrapper">
                        <svg class="contact-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                    </div>
                    <span class="contact-text phone-number" id="phoneNumber">01004487912</span>
                </div>
                <div class="contact-item location-item">
                    <div class="contact-icon-wrapper location-icon-wrapper">
                        <svg class="contact-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </div>
                    <span class="contact-text location-text">شارع أ/ محمد عبدالهادي<br>منزل الحاج/ ابراهيم الشناوي</span>
                </div>
            </div>
        </div>

        <!-- Corner Decorations -->
        <div class="corner-deco corner-top-right"></div>
        <div class="corner-deco corner-bottom-left"></div>
    </div>

    <script>
        // Add staggered animation to features
        document.addEventListener('DOMContentLoaded', () => {
            const features = document.querySelectorAll('.feature-item');
            features.forEach((feature, index) => {
                feature.style.animationDelay = `${0.8 + index * 0.15}s`;
            });
        });
    </script>
</body>
</html>
