<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدكتورة أية فودة - استاذة العلوم</title>
    <meta name="description" content="الدكتورة أية فودة - استاذة العلوم والعلوم المتكاملة">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="poster" id="poster">
        <!-- Layered Background Effects -->
        <div class="bg-layer bg-gradient"></div>
        <div class="bg-layer bg-noise"></div>
        <div class="bg-layer bg-vignette"></div>

        <!-- Ambient Glow Orbs -->
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>
        <div class="glow glow-4"></div>

        <!-- Geometric Grid Pattern -->
        <div class="grid-pattern"></div>

        <!-- Floating Science Decorations -->
        <div class="sci-deco sci-atom-1">
            <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1">
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(0 60 60)"/>
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(60 60 60)"/>
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(-60 60 60)"/>
                <circle cx="60" cy="60" r="6" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <div class="sci-deco sci-atom-2">
            <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1">
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(30 60 60)"/>
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(90 60 60)"/>
                <ellipse cx="60" cy="60" rx="55" ry="20" transform="rotate(-30 60 60)"/>
                <circle cx="60" cy="60" r="5" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <div class="sci-deco sci-helix">
            <svg viewBox="0 0 50 160" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M10,5 Q40,25 10,45 Q40,65 10,85 Q40,105 10,125 Q40,145 10,160"/>
                <path d="M40,5 Q10,25 40,45 Q10,65 40,85 Q10,105 40,125 Q10,145 40,160"/>
                <line x1="16" y1="15" x2="34" y2="15" opacity="0.4"/>
                <line x1="16" y1="35" x2="34" y2="35" opacity="0.4"/>
                <line x1="16" y1="55" x2="34" y2="55" opacity="0.4"/>
                <line x1="16" y1="75" x2="34" y2="75" opacity="0.4"/>
                <line x1="16" y1="95" x2="34" y2="95" opacity="0.4"/>
                <line x1="16" y1="115" x2="34" y2="115" opacity="0.4"/>
                <line x1="16" y1="135" x2="34" y2="135" opacity="0.4"/>
                <line x1="16" y1="155" x2="34" y2="155" opacity="0.4"/>
            </svg>
        </div>
        <div class="sci-deco sci-molecule">
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.2">
                <circle cx="50" cy="30" r="10"/>
                <circle cx="25" cy="70" r="8"/>
                <circle cx="75" cy="70" r="8"/>
                <line x1="44" y1="38" x2="30" y2="63"/>
                <line x1="56" y1="38" x2="70" y2="63"/>
                <line x1="33" y1="70" x2="67" y2="70"/>
            </svg>
        </div>

        <!-- Top Accent Bar -->
        <div class="top-bar"></div>
        <div class="bottom-bar"></div>

        <!-- Corner Frames -->
        <div class="frame frame-tl"></div>
        <div class="frame frame-tr"></div>
        <div class="frame frame-bl"></div>
        <div class="frame frame-br"></div>

        <!-- ============ CONTENT ============ -->
        <div class="content">

            <!-- Announcement Badge -->
            <div class="announce-badge">
                <div class="badge-glow"></div>
                <span class="badge-label">تُعلن</span>
            </div>

            <!-- Name Section -->
            <div class="name-section">
                <span class="pre-title">الدكتورة</span>
                <h1 class="doctor-name">أيــة فــودة</h1>
            </div>

            <!-- Elegant Separator -->
            <div class="separator">
                <div class="sep-line"></div>
                <div class="sep-diamond">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 1.74.5 3.37 1.41 4.84.95 1.54 2.2 2.86 3.16 4.4.47.75.81 1.45 1.17 2.26.1.24.34.5.26.5s.16-.26.26-.5c.36-.81.7-1.51 1.17-2.26.96-1.54 2.21-2.86 3.16-4.4C16.5 12.37 17 10.74 17 9c0-3.87-3.13-7-7-7z"/>
                        <circle cx="12" cy="9" r="2.5"/>
                    </svg>
                </div>
                <div class="sep-line"></div>
            </div>

            <!-- Subject Section -->
            <div class="subject-section">
                <span class="subject-label">أستاذة</span>
                <h2 class="subject-name">العلوم و العلوم المتكاملة</h2>
            </div>

            <!-- Year / Booking Section -->
            <div class="booking-section">
                <div class="booking-label">
                    <span class="sparkle">✦</span>
                    بدأ الحجز لعام
                    <span class="sparkle">✦</span>
                </div>
                <div class="year-row">
                    <span class="year-num">٢٠٢٦</span>
                    <span class="year-dash">⟶</span>
                    <span class="year-num">٢٠٢٧</span>
                </div>
            </div>

            <!-- Features -->
            <div class="features">
                <div class="feat">
                    <span class="feat-dot"></span>
                    <span class="feat-txt">شرح مبسط وسهل</span>
                </div>
                <div class="feat">
                    <span class="feat-dot"></span>
                    <span class="feat-txt">تأسيس وتقوية</span>
                </div>
                <div class="feat">
                    <span class="feat-dot"></span>
                    <span class="feat-txt">امتحانات دورية</span>
                </div>
                <div class="feat">
                    <span class="feat-dot"></span>
                    <span class="feat-txt">مراجعات مستمرة</span>
                </div>
                <div class="feat">
                    <span class="feat-dot"></span>
                    <span class="feat-txt">متابعة مع ولي الأمر</span>
                </div>
            </div>

            <!-- Contact Area -->
            <div class="contact-area">
                <div class="contact-card phone-card">
                    <div class="c-icon-box green-icon">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                            <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                    </div>
                    <span class="c-text phone-num">01004487912</span>
                </div>
                <div class="contact-card loc-card">
                    <div class="c-icon-box gold-icon">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </div>
                    <div class="c-text loc-text">
                        <span>شارع أ/ محمد عبدالهادي</span>
                        <span class="loc-sub">منزل الحاج/ ابراهيم الشناوي</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
